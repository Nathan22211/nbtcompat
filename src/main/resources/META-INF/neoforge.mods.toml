modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "nbtcompat"
version = "1.0.0"
displayName = "NBT Compat"
authors = "nathan"
description = '''Every Compat–style wooden variants with a tiny registry: one block per kind, wood identity and textures stored in NBT / data components. Embeds Movable Tile Entities (MIT) so furniture block entities can be piston-moved. Create casings remember the log wood (and remapped metal trim).'''

[[mixins]]
config = "nbtcompat.mixins.json"

[[mixins]]
config = "nbtcompat_create.mixins.json"

[[mixins]]
config = "nbtcompat_mekanism.mixins.json"

[[dependencies.nbtcompat]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.nbtcompat]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.nbtcompat]]
modId = "movable_tile_entities"
type = "required"
versionRange = "[1.2.0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.nbtcompat]]
modId = "create"
type = "optional"
versionRange = "[6.0,)"
ordering = "AFTER"
side = "BOTH"
# Soft depend: casing / encased blocks + Create mixins register only when Create is present.

[[dependencies.nbtcompat]]
modId = "moonlight"
type = "optional"
versionRange = "[1.21,)"
